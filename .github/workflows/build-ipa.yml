name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          # XcodeGen may emit the newest project format; Xcode 15.4 accepts objectVersion 60.
          sed -i '' 's/objectVersion = 77/objectVersion = 60/' NanoStreamClone.xcodeproj/project.pbxproj
          sed -i '' '/preferredProjectObjectVersion = 77;/d' NanoStreamClone.xcodeproj/project.pbxproj

      - name: Archive unsigned app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NanoStreamClone.xcodeproj \
            -scheme NanoStreamClone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/NanoStreamClone.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER=com.k20.nanostream.clone \
            INFOPLIST_FILE=Resources/AppInfo.plist \
            GENERATE_INFOPLIST_FILE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/NanoStreamClone.xcarchive/Products/Applications/NanoStreamClone.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NanoStreamClone-unsigned.ipa

      - name: Upload IPA and logs
        uses: actions/upload-artifact@v4
        with:
          name: NanoStreamClone-unsigned
          path: |
            build/NanoStreamClone-unsigned.ipa
            build.log
